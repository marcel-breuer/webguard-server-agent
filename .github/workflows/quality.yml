name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          check-latest: true

      - name: Run formatting, static analysis, and tests
        run: make check

      - name: Build Linux artifacts
        run: make dist VERSION=ci
