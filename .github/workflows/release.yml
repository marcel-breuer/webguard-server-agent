name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Create next patch tag
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"

          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          git tag --annotate "$next_tag" --message "Release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

  release:
    needs: create-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          check-latest: true

      - name: Verify source
        run: make check

      - name: Build Linux artifacts
        env:
          VERSION: ${{ needs.create-tag.outputs.tag }}
        run: make dist VERSION="$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-tag.outputs.tag }}
        run: gh release create "$TAG" dist/webguard-server-agent_* dist/SHA256SUMS --generate-notes --title "$TAG"
