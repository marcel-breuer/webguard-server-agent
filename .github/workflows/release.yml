name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          check-latest: true

      - name: Verify source
        run: make check

      - name: Build Linux artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist VERSION="$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/webguard-server-agent_* dist/SHA256SUMS --generate-notes --title "$TAG"
