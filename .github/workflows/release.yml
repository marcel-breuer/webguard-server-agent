name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Create next patch tag
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"

          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next_tag" --message "Release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

  release:
    needs: create-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          check-latest: true

      - name: Verify source
        run: make check

      - name: Build Linux artifacts
        env:
          VERSION: ${{ needs.create-tag.outputs.tag }}
        run: |
          make dist VERSION="$VERSION"
          make deb VERSION="$VERSION"

      - name: Import APT repository signing key
        env:
          APT_REPOSITORY_SIGNING_KEY_B64: ${{ secrets.APT_REPOSITORY_SIGNING_KEY_B64 }}
        run: |
          test -n "$APT_REPOSITORY_SIGNING_KEY_B64"
          install -d -m 0700 "$RUNNER_TEMP/apt-gnupg"
          echo "$APT_REPOSITORY_SIGNING_KEY_B64" | base64 --decode | gpg --batch --homedir "$RUNNER_TEMP/apt-gnupg" --import

      - name: Build and validate APT repository
        env:
          VERSION: ${{ needs.create-tag.outputs.tag }}
          GNUPGHOME: ${{ runner.temp }}/apt-gnupg
          GPG_KEY_ID: 15DC3CB2BDB5E3C325B15B5D54F445D599EAACA2
          APT_REPOSITORY_SIGNING_PASSPHRASE: ${{ secrets.APT_REPOSITORY_SIGNING_PASSPHRASE }}
        run: |
          test -n "$APT_REPOSITORY_SIGNING_PASSPHRASE"
          repository_dir="$RUNNER_TEMP/webguard-server-agent-apt"
          ./scripts/build-apt-repository.sh "$repository_dir" dist/deb
          ./scripts/test-apt-install.sh "$repository_dir" packaging/apt/webguard-server-agent-archive-keyring.asc "$VERSION"

      - name: Publish APT repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-tag.outputs.tag }}
          APT_REPOSITORY_SIGNING_PASSPHRASE: ${{ secrets.APT_REPOSITORY_SIGNING_PASSPHRASE }}
        run: |
          repository_dir="$RUNNER_TEMP/webguard-server-agent-apt-publish"
          if ! git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$repository_dir"; then
            rm -rf "$repository_dir"
            mkdir -p "$repository_dir"
            git -C "$repository_dir" init
            git -C "$repository_dir" checkout --orphan gh-pages
            git -C "$repository_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          export GPG_KEY_ID=15DC3CB2BDB5E3C325B15B5D54F445D599EAACA2
          export APT_REPOSITORY_SIGNING_PASSPHRASE
          ./scripts/build-apt-repository.sh "$repository_dir" dist/deb
          git -C "$repository_dir" config user.name "github-actions[bot]"
          git -C "$repository_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository_dir" add --all
          git -C "$repository_dir" commit -m "chore: publish APT repository $TAG"
          git -C "$repository_dir" push origin gh-pages

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-tag.outputs.tag }}
        run: gh release create "$TAG" dist/webguard-server-agent_* dist/deb/*.deb dist/SHA256SUMS packaging/apt/webguard-server-agent-archive-keyring.asc --generate-notes --title "$TAG"
